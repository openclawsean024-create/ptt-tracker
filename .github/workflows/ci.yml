name: CI

# Sean 10-repo-fleet Batch 4D — Python-flavored 4-job CI for ptt-tracker.
# Layout:
#   lint     → ruff (Python correctness linter)
#   test     → pytest (Python 3.11, requirements.txt + dev pytest)
#   build    → compileall (Python bytecode) + node --check (vanilla JS sources)
#   security → pip-audit + npm audit (advisory only) + secrets-grep gate
#
# Notes:
#   - ptt-tracker is Python-primary with a thin Node surface (tracker.js, app.js).
#     No Vite/npm build step, so the "build" job is bytecode + JS syntax check.
#   - secrets-grep is folded into `security` to keep the 4-job shape required by
#     the fleet spec (lint / test / build / deploy), and matches the threat model
#     in SECURITY.md (Telegram bot token / GitHub PAT / AWS access key).
#   - All jobs are advisory or fast; the whole pipeline finishes in < 3 min.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: CI only reads the repo. No write scopes, no id-token.
permissions: read-all

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- 1. lint ------------------------------------------------------------
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ruff
        run: python3 -m pip install --upgrade pip && python3 -m pip install ruff

      - name: Run ruff
        # Conservative config (E/F/W/B + per-file ignores for legacy/tests).
        # Fails the run on real correctness issues only.
        run: ruff check .

  # ---- 2. test ------------------------------------------------------------
  test:
    name: test (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime + test dependencies
        # Runtime deps from requirements.txt (tracked). Pytest is a dev-only dep.
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install pytest

      - name: Run pytest
        run: python3 -m pytest -q

  # ---- 3. build -----------------------------------------------------------
  # ptt-tracker has no bundler — the "build" gate is:
  #   - Python bytecode compile (catches syntax errors across the whole tree)
  #   - Node --check (catches JS syntax errors in tracker.js / api/ / sources/)
  build:
    name: build (compileall + node --check)
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python bytecode compile
        run: python3 -m compileall .

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Node syntax check
        run: |
          for f in tracker.js api/tracker.js app.js sources/*.js; do
            node --check "$f"
          done

  # ---- 4. security --------------------------------------------------------
  # Advisory only: known CVE scan + secrets leak scan. Failed secrets-grep is
  # the only blocking check; pip-audit / npm audit are continue-on-error so
  # the merge queue isn't blocked by upstream-only advisories.
  security:
    name: security (pip-audit + secrets-grep + npm audit)
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: pip-audit (advisory)
        continue-on-error: true
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pip-audit
          if [ -f requirements.txt ]; then
            python3 -m pip-audit -r requirements.txt
          else
            echo "no requirements.txt; skipping"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm audit (advisory)
        continue-on-error: true
        run: |
          if [ -f package-lock.json ]; then
            npm audit --audit-level=high
          else
            echo "no package-lock.json (no runtime npm deps); skipping"
          fi

      - name: secrets-grep (BLOCKING)
        # Patterns match documented formats in .env.example + SECURITY.md.
        # Excludes the same files as round-1 to avoid false positives.
        run: |
          set +e
          PATTERNS=(
            'telegram_token[^A-Za-z0-9_][^"'\'']{0,4}["'\'']?[0-9]{6,12}:[A-Za-z0-9_-]{30,}'
            'ghp_[A-Za-z0-9]{20,}'
            'github_pat_[A-Za-z0-9_]{20,}'
            'AKIA[0-9A-Z]{16}'
          )
          EXCLUDES='--exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.pytest_cache --exclude-dir=__pycache__ --exclude=requirements*.txt --exclude=.env.example --exclude=SECURITY.md --exclude=.gitignore --exclude=ruff.toml --exclude=PRD/CHANGELOG.md'
          ANY_MATCH=0
          for p in "${PATTERNS[@]}"; do
            echo "::group::pattern: $p"
            matches=$(git grep -nIE "$p" $EXCLUDES || true)
            if [ -n "$matches" ]; then
              echo "FAIL — pattern matched:"
              echo "$matches"
              ANY_MATCH=1
            else
              echo "OK — no matches"
            fi
            echo "::endgroup::"
          done
          if [ "$ANY_MATCH" -ne 0 ]; then
            echo "::error::Committed secret-like string detected. See scan output above."
            exit 1
          fi
