name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only reads the repo. No write scopes, no id-token.
permissions: read-all

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheapest gate first: pure syntax parse, no dependency install.
  syntax-check:
    name: syntax-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python bytecode compile
        run: python3 -m compileall .

      - name: Node syntax check
        run: node --check tracker.js && node --check api/tracker.js

  tests:
    name: tests
    runs-on: ubuntu-latest
    needs: syntax-check
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install test dependencies
        # No requirements.txt in repo yet; runtime deps of ptt_tracker.py are
        # installed explicitly so pytest can import the module under test.
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest requests beautifulsoup4
          if [ -f requirements.txt ]; then python3 -m pip install -r requirements.txt; fi

      - name: Run pytest
        run: python3 -m pytest -q

  # Advisory only: reports known CVEs without blocking the merge queue yet.
  security-audit:
    name: security-audit
    runs-on: ubuntu-latest
    needs: syntax-check
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: pip-audit
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pip-audit
          if [ -f requirements.txt ]; then
            python3 -m pip-audit -r requirements.txt || true
          else
            echo "no requirements.txt yet; skipping dependency audit"
          fi

      - name: npm audit
        run: |
          if [ -f package-lock.json ]; then
            npm audit --audit-level=high || true
          else
            echo "no package-lock.json (no runtime npm dependencies); skipping npm audit"
          fi
