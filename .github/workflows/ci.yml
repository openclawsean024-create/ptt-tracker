name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only reads the repo. No write scopes, no id-token.
permissions: read-all

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheapest gate first: pure syntax parse, no dependency install.
  syntax-check:
    name: syntax-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python bytecode compile
        run: python3 -m compileall .

      - name: Node syntax check
        run: node --check tracker.js && node --check api/tracker.js && node --check app.js

  # Blocking secret-leak scan — fails the run if anything that *looks like* a
  # real Telegram bot token / GitHub PAT / AWS access key is committed.
  # Matches the patterns documented in `.env.example` + SECURITY.md.
  secrets-grep:
    name: secrets-grep
    runs-on: ubuntu-latest
    needs: syntax-check
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Grep for committed credentials
        # Each pattern below must fail the job on at least one match. Excludes
        # are scoped to files where a placeholder is expected to live:
        #   - .env.example documents the variable names without values
        #   - .github/workflows/ci.yml references the env var names in CI
        #   - SECURITY.md / *.md may discuss the formats for documentation
        #   - tests / __pycache__ / .git / node_modules are build artefacts
        run: |
          set +e
          PATTERNS=(
            # Telegram bot token (per @BotFather): '<bot_id>:<~35 chars>'
            'telegram_token[^A-Za-z0-9_][^"'\'']{0,4}["'\'']?[0-9]{6,12}:[A-Za-z0-9_-]{30,}'
            # GitHub classic personal access token
            'ghp_[A-Za-z0-9]{20,}'
            # GitHub fine-grained personal access token
            'github_pat_[A-Za-z0-9_]{20,}'
            # AWS access key id
            'AKIA[0-9A-Z]{16}'
          )
          EXCLUDES='--exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.pytest_cache --exclude-dir=__pycache__ --exclude=requirements*.txt --exclude=.env.example --exclude=SECURITY.md --exclude=.gitignore'
          ANY_MATCH=0
          for p in "${PATTERNS[@]}"; do
            echo "::group::pattern: $p"
            matches=$(git grep -nIE "$p" $EXCLUDES || true)
            if [ -n "$matches" ]; then
              echo "FAIL — pattern matched:"
              echo "$matches"
              ANY_MATCH=1
            else
              echo "OK — no matches"
            fi
            echo "::endgroup::"
          done
          if [ "$ANY_MATCH" -ne 0 ]; then
            echo "::error::Committed secret-like string detected. See scan output above."
            exit 1
          fi

  tests:
    name: tests
    runs-on: ubuntu-latest
    needs: [syntax-check, secrets-grep]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime + test dependencies
        # Runtime deps from requirements.txt (now tracked) — `cache: pip` above
        # uses this file as the cache key. Pytest is a dev-only dep.
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install pytest

      - name: Run pytest
        run: python3 -m pytest -q

  # Advisory only: reports known CVEs without blocking the merge queue yet.
  security-audit:
    name: security-audit
    runs-on: ubuntu-latest
    needs: [syntax-check, secrets-grep]
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: pip-audit
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pip-audit
          if [ -f requirements.txt ]; then
            python3 -m pip-audit -r requirements.txt || true
          else
            echo "no requirements.txt yet; skipping dependency audit"
          fi

      - name: npm audit
        run: |
          if [ -f package-lock.json ]; then
            npm audit --audit-level=high || true
          else
            echo "no package-lock.json (no runtime npm dependencies); skipping npm audit"
          fi
