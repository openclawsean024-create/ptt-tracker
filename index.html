<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PTT 文章追蹤器</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>📋 PTT 文章追蹤器</h1>
      <span class="badge">Node.js</span>
    </header>

    <div class="controls">
      <button
        id="refreshBtn"
        type="button"
        aria-label="刷新文章列表"
      >🔄 刷新</button>
    </div>

    <div class="status" id="status" role="status" aria-live="polite">點擊「刷新」載入文章</div>

    <div class="tabs" role="tablist" aria-label="文章檢視切換">
      <button
        class="tab active"
        id="tabAll"
        type="button"
        role="tab"
        aria-selected="true"
        aria-controls="articleList"
      >🔥 熱門文章</button>
      <button
        class="tab"
        id="tabKeyword"
        type="button"
        role="tab"
        aria-selected="false"
        aria-controls="articleList"
      >🎯 關鍵字命中</button>
    </div>

    <div class="article-list" id="articleList" role="tabpanel" aria-live="polite"></div>
  </div>

  <!-- All client-side logic lives in the external file so the strict CSP
       (script-src 'self') does not block any functionality. -->
  <script src="app.js"></script>
</body>
</html>
